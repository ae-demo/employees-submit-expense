openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: "Expense claims, approvals, policy limits, people and payroll exports."
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: "The caller's own claims"
            claims:submit: "Create, edit, submit and withdraw the caller's own claims and their receipts"
            claims:review-team: "Read, approve and reject claims of the caller's direct reports"
            claims:read-all: "Every claim"
            categories:manage: "Create categories and set their maximum"
            people:manage: "List employees and assign managers"
            exports:create: "Export approved claims"
            exports:read: "List and download exports"
  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    claimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }
    lineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: "The request is malformed or breaks a rule."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: "No valid sign-in, or the caller lacks the permission."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: "The record does not exist or is not the caller's."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: "HTTP or application error code" }
        message: { type: string, description: "short human-readable label" }
        description: { type: string, description: "detailed explanation" }
        moreInfo: { type: string, description: "URI to documentation" }
    ClaimRefusal:
      description: "A submit refused because of limits, missing lines or a missing manager."
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            violations:
              type: array
              items: { $ref: '#/components/schemas/LimitViolation' }
    LimitViolation:
      type: object
      required: [lineId, description, category, amountCents, maximumCents]
      properties:
        lineId: { type: string, format: uuid }
        description: { type: string, description: "the expense line's description" }
        category: { type: string }
        amountCents: { type: integer }
        maximumCents: { type: integer }
    Me:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        managerName: { type: string, nullable: true, description: "null until Finance assigns a manager" }
    Category:
      type: object
      required: [id, name, maximumCents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maximumCents: { type: integer, nullable: true, description: "maximum amount per expense line; null means no limit" }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        maximumCents: { type: integer, nullable: true }
    CategoryPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Category' } }
    ClaimSummary:
      type: object
      required: [id, number, employeeName, description, status, totalCents]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: "for example EXP-1042" }
        employeeName: { type: string }
        description: { type: string }
        status: { type: string, enum: [Draft, Submitted, Approved, Rejected, Exported] }
        totalCents: { type: integer, description: "sum of the claim's lines" }
        submittedOn: { type: string, format: date, nullable: true }
        decidedOn: { type: string, format: date, nullable: true }
    ClaimPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
    ClaimDetail:
      allOf:
        - $ref: '#/components/schemas/ClaimSummary'
        - type: object
          required: [lines]
          properties:
            rejectionReason: { type: string, nullable: true }
            lines: { type: array, items: { $ref: '#/components/schemas/ExpenseLine' } }
    ClaimInput:
      type: object
      required: [description]
      properties:
        description: { type: string }
    ExpenseLine:
      type: object
      required: [id, expenseDate, category, amountCents, description, receipts]
      properties:
        id: { type: string, format: uuid }
        expenseDate: { type: string, format: date }
        category: { type: string }
        amountCents: { type: integer }
        description: { type: string }
        receipts: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
    ExpenseLineInput:
      type: object
      required: [expenseDate, categoryId, amountCents, description]
      properties:
        expenseDate: { type: string, format: date }
        categoryId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 1 }
        description: { type: string }
    Receipt:
      type: object
      required: [id, fileName, contentType, fileUrl]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string, description: "an image type or application/pdf" }
        fileUrl: { type: string, description: "relative URI of the operation that returns the file for this caller" }
    ReceiptUploadForm:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: "an image or PDF, at most 10 MB" }
    Rejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    Person:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        managerId: { type: string, format: uuid, nullable: true }
        managerName: { type: string, nullable: true }
    PersonPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Person' } }
    ManagerAssignment:
      type: object
      properties:
        managerId: { type: string, format: uuid, nullable: true, description: "null removes the manager" }
    Export:
      type: object
      required: [id, createdOn, createdByName, claimCount, totalCents]
      properties:
        id: { type: string, format: uuid }
        createdOn: { type: string, format: date }
        createdByName: { type: string }
        claimCount: { type: integer }
        totalCents: { type: integer }
    ExportPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Export' } }
    ExportInput:
      type: object
      required: [claimIds]
      properties:
        claimIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
security:
  - oauth2: []
paths:
  /me:
    get:
      operationId: getMe
      summary: "The signed-in person; creates their record on first sign-in"
      responses:
        '200':
          description: "The caller."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /categories:
    get:
      operationId: listCategories
      summary: "Every category with its maximum, for any signed-in person"
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: "A page of categories."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCategory
      summary: "Create a category"
      security:
        - oauth2: [categories:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: "The category."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /categories/{categoryId}:
    put:
      operationId: updateCategory
      summary: "Rename a category or set, change or remove its maximum"
      security:
        - oauth2: [categories:manage]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: "The category."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims:
    get:
      operationId: listMyClaims
      summary: "The caller's claims, newest first"
      security:
        - oauth2: [claims:read]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [Draft, Submitted, Approved, Rejected, Exported] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: "A page of the caller's claims."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMyClaim
      summary: "Create a draft claim for the caller"
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: "The new draft claim."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/claims/{claimId}:
    get:
      operationId: getMyClaim
      summary: "One of the caller's claims with its lines and receipts"
      security:
        - oauth2: [claims:read]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: "The claim."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateMyClaim
      summary: "Change the description of the caller's claim until it is decided"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200':
          description: "The claim."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims/{claimId}/lines:
    post:
      operationId: addMyClaimLine
      summary: "Add an expense line to the caller's claim until it is decided"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseLineInput' }
      responses:
        '201':
          description: "The new line."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims/{claimId}/lines/{lineId}:
    put:
      operationId: updateMyClaimLine
      summary: "Change an expense line of the caller's claim until it is decided"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseLineInput' }
      responses:
        '200':
          description: "The line."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeMyClaimLine
      summary: "Remove an expense line from the caller's claim until it is decided"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
      responses:
        '204':
          description: "The line is removed."
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims/{claimId}/lines/{lineId}/receipts:
    post:
      operationId: uploadMyReceipt
      summary: "Attach a receipt file to the caller's line until the claim is decided"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ReceiptUploadForm' }
      responses:
        '201':
          description: "The stored receipt."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims/{claimId}/lines/{lineId}/receipts/{receiptId}:
    delete:
      operationId: removeMyReceipt
      summary: "Remove a receipt from the caller's line until the claim is decided"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: "The receipt is removed."
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims/{claimId}/lines/{lineId}/receipts/{receiptId}/file:
    get:
      operationId: downloadMyReceipt
      summary: "The file of a receipt on the caller's own claim"
      security:
        - oauth2: [claims:read]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "The receipt file."
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/claims/{claimId}/submit:
    post:
      operationId: submitMyClaim
      summary: "Submit the caller's draft or rejected claim to their manager"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: "The claim is Submitted and the manager is emailed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "Refused: no lines, no manager assigned, or a line over its maximum."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimRefusal' }
  /me/claims/{claimId}/withdraw:
    post:
      operationId: withdrawMyClaim
      summary: "Withdraw the caller's submitted claim back to Draft"
      security:
        - oauth2: [claims:submit]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: "The claim is Draft again."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/claims:
    get:
      operationId: listTeamClaims
      summary: "Claims of the caller's direct reports, oldest submission first; never drafts"
      security:
        - oauth2: [claims:review-team]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [Submitted, Approved, Rejected, Exported] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: "A page of the team's claims."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/team/claims/{claimId}:
    get:
      operationId: getTeamClaim
      summary: "One claim of a direct report with its lines and receipts"
      security:
        - oauth2: [claims:review-team]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: "The claim."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/claims/{claimId}/lines/{lineId}/receipts/{receiptId}/file:
    get:
      operationId: downloadTeamReceipt
      summary: "The file of a receipt on a direct report's claim"
      security:
        - oauth2: [claims:review-team]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "The receipt file."
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/claims/{claimId}/approve:
    post:
      operationId: approveTeamClaim
      summary: "Approve a direct report's submitted claim"
      security:
        - oauth2: [claims:review-team]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: "The claim is Approved and the employee is emailed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/team/claims/{claimId}/reject:
    post:
      operationId: rejectTeamClaim
      summary: "Reject a direct report's submitted claim with a reason"
      security:
        - oauth2: [claims:review-team]
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rejection' }
      responses:
        '200':
          description: "The claim is Rejected and the employee is emailed the reason."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /claims:
    get:
      operationId: listClaims
      summary: "Every claim, filterable by status"
      security:
        - oauth2: [claims:read-all]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [Draft, Submitted, Approved, Rejected, Exported] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: "A page of claims."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /claims/{claimId}:
    get:
      operationId: getClaim
      summary: "Any claim with its lines and receipts"
      security:
        - oauth2: [claims:read-all]
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        '200':
          description: "The claim."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /claims/{claimId}/lines/{lineId}/receipts/{receiptId}/file:
    get:
      operationId: downloadReceipt
      summary: "The file of a receipt on any claim"
      security:
        - oauth2: [claims:read-all]
      parameters:
        - $ref: '#/components/parameters/claimId'
        - $ref: '#/components/parameters/lineId'
        - name: receiptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "The receipt file."
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people:
    get:
      operationId: listPeople
      summary: "Every employee who has signed in, with their manager"
      security:
        - oauth2: [people:manage]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: "A page of employees."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /people/{personId}/manager:
    put:
      operationId: assignManager
      summary: "Assign, change or remove an employee's manager"
      security:
        - oauth2: [people:manage]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerAssignment' }
      responses:
        '200':
          description: "The employee."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exports:
    get:
      operationId: listExports
      summary: "Past payroll exports, newest first"
      security:
        - oauth2: [exports:read]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: "A page of exports."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createExport
      summary: "Export the chosen approved claims and mark them Exported"
      security:
        - oauth2: [exports:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportInput' }
      responses:
        '201':
          description: "The export; its claims are now Exported."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exports/{exportId}/file:
    get:
      operationId: downloadExportFile
      summary: "Download an export as CSV, one row per claim"
      security:
        - oauth2: [exports:read]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "The CSV file: employee, claim number, total, approval date."
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
